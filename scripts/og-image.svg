<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <!-- userSpaceOnUse is required: resvg renders objectBoundingBox radial
         gradients with a gradientTransform as a flat fill. -->
    <radialGradient id="glowCyan" gradientUnits="userSpaceOnUse" cx="140" cy="50" r="720">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" gradientUnits="userSpaceOnUse" cx="1090" cy="610" r="640">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.13"/>
      <stop offset="0.55" stop-color="#10b981" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentBar" gradientUnits="userSpaceOnUse" x1="92" y1="0" x2="188" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1200" height="630" fill="#080b10"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glowCyan)"/>
  <rect width="1200" height="630" fill="url(#glowGreen)"/>

  <!-- right-side monogram -->
  <g opacity="0.16">
    <rect x="852" y="145" width="268" height="268" rx="56" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <text x="986" y="332" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif"
          font-size="150" font-weight="700" letter-spacing="6" fill="#22d3ee">DT</text>
  </g>

  <!-- eyebrow pill -->
  <g>
    <rect x="90" y="96" width="452" height="42" rx="10" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.38" stroke-width="1"/>
    <text x="316" y="124" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif"
          font-size="18" font-weight="600" letter-spacing="3" fill="#22d3ee">WHITE HAT ETHICAL HACKER · SRI LANKA</text>
  </g>

  <!-- brand -->
  <text x="88" y="268" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="96" font-weight="700" letter-spacing="6">
    <tspan fill="#ffffff">CYBER</tspan><tspan fill="#22d3ee" dx="16">DT</tspan>
  </text>

  <!-- accent bar -->
  <rect x="92" y="302" width="96" height="5" rx="2.5" fill="url(#accentBar)"/>

  <!-- name + role -->
  <text x="90" y="382" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="46" font-weight="600" fill="#e2e8f0">Darshitha Theekshana</text>
  <text x="90" y="430" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" fill="#94a3b8">White Hat Ethical Hacker · Cyber Security Specialist</text>
  <text x="90" y="468" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" fill="#64748b">Mobile &amp; Desktop System Expert</text>

  <!-- service tags -->
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" font-weight="500">
    <rect x="90" y="506" width="212" height="40" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#334155" stroke-width="1"/>
    <text x="196" y="532" text-anchor="middle" fill="#cbd5e1">Penetration Testing</text>

    <rect x="316" y="506" width="196" height="40" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#334155" stroke-width="1"/>
    <text x="414" y="532" text-anchor="middle" fill="#cbd5e1">Malware Analysis</text>

    <rect x="526" y="506" width="216" height="40" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#334155" stroke-width="1"/>
    <text x="634" y="532" text-anchor="middle" fill="#cbd5e1">System Hardening</text>
  </g>

  <!-- domain chip -->
  <g>
    <rect x="90" y="566" width="286" height="38" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="1"/>
    <text x="233" y="591" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif"
          font-size="19" font-weight="600" letter-spacing="1" fill="#67e8f9">cyberdt.pages.dev</text>
  </g>
</svg>
