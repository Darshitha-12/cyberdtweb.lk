name: Build & Publish CYBER DT

# Builds the site and copies the compiled output into the repository root.
# The branch-based GitHub Pages deployment then serves the REAL app
# (this removes the conflict where raw source files were published instead).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-publish
  cancel-in-progress: true

jobs:
  publish:
    # Skip the commit made by this workflow itself (prevents loops).
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore clean HTML template
        run: cp template.html index.html

      - name: Build site
        run: npm run build

      - name: Publish built site into repository root
        run: |
          rm -rf assets
          cp -r dist/assets .
          cp dist/*.html . 2>/dev/null || true
          cp dist/robots.txt . 2>/dev/null || true
          cp dist/sitemap.xml . 2>/dev/null || true
          cp dist/og-image.png . 2>/dev/null || true
          touch .nojekyll
          rm -rf dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish built site"
            git push
          else
            echo "Nothing to publish - build output unchanged."
          fi
